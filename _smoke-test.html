<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Vocab Daily 冒烟测试</title></head>
<body>
<div id="out">PENDING</div>
<iframe id="f" src="index.html" style="width:420px;height:760px;border:1px solid #ccc"></iframe>
<script>
// 自动化冒烟测试：把 index.html 装进 iframe 里，跑一遍完整学习流程
// 用法：启动本地服务器后访问 http://localhost:8080/_smoke-test.html
// 结果除了显示在页面上，还会回传到服务器日志（/__smoke?d=...），方便命令行读取
const results = [];
function log(s) {
  results.push(s);
  document.getElementById('out').textContent = results.join('\n');
}
function report() {
  // 回传结果：服务器会返回 404，但请求路径会记录在服务器日志里
  const url = '/__smoke?d=' + encodeURIComponent(results.join('\n'));
  try { fetch(url).catch(() => {}); } catch (e) {}
}
function ok(name, cond, extra) {
  log((cond ? 'PASS' : 'FAIL') + ' | ' + name + (extra !== undefined ? ' | ' + extra : ''));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
setTimeout(() => {}, 120000); // 保活

const frame = document.getElementById('f');
frame.onload = run;

async function run() {
  const W = frame.contentWindow;
  const D = frame.contentDocument;
  const ev = code => W.eval(code);          // 在 iframe 的全局作用域里取值/调用
  const errs = [];
  W.addEventListener('error', e => errs.push('error: ' + e.message));
  W.addEventListener('unhandledrejection', e => errs.push('rejection: ' + e.reason));

  // 等应用初始化完成（首次运行要往数据库导入 597 个词，需要时间）
  let ready = false;
  for (let i = 0; i < 100; i++) {
    await wait(200);
    if (/^[1-9]/.test(D.getElementById('stat-total').textContent)) { ready = true; break; }
  }
  ok('应用初始化完成', ready, 'stat-total=' + D.getElementById('stat-total').textContent);
  if (!ready) { log('=== DONE ==='); report(); return; }

  try {
    // ---- 1. 词库加载 ----
    ok('词库总数 = 597', D.getElementById('stat-total').textContent === '597', D.getElementById('stat-total').textContent);
    ok('主题标签渲染', D.getElementById('theme-tags').children.length === 22, D.getElementById('theme-tags').children.length + ' 个');

    // ---- 2. 组卷 ----
    ev('startStudy()');
    await wait(600);
    const qLen = ev('appState.todayQueue.length');
    ok('组卷 500 张', qLen === 500, qLen);
    ok('进入学习页', D.getElementById('page-study').classList.contains('active'));
    ok('卡片已渲染', !!D.getElementById('active-card'));
    ok('卡片发音按钮存在', !!D.getElementById('card-speak'));

    // ---- 3. 连点防抖（双击只记一次账）----
    ev('handleKnown()'); ev('handleKnown()'); ev('handleKnown()');
    await wait(900);
    const rec1 = await ev("get('daily', getTodayStr()).then(r => r ? r.completed : null)");
    ok('连点 3 次只记 1 次账', rec1 === 1, 'completed=' + rec1);
    ok('指针只前进 1 格', ev('appState.currentIndex') === 1, ev('appState.currentIndex'));

    // ---- 4. 撤销 ----
    ev('undoKnown(0)');
    await wait(900);
    const rec2 = await ev("get('daily', getTodayStr()).then(r => r ? r.completed : null)");
    ok('撤销后计数回退', rec2 === 0, 'completed=' + rec2);
    const progLeft = await ev("get('progress', appState.todayQueue[appState.currentIndex].id).then(p => p ? p.status : 'none')");
    ok('撤销后进度记录已清除', progLeft === 'none' || progLeft === 'unknown', 'status=' + progLeft);

    // ---- 5. 刷新后仍能撤销（从今日记录重建列表）----
    ev('handleKnown()');
    await wait(900);
    ev('appState.todayKnown = []');   // 模拟刷新页面后内存丢失
    ev('startStudy()');
    await wait(900);
    ok('今日已认识列表可从记录重建', ev('appState.todayKnown.length') === 1, ev('appState.todayKnown.length'));

    // ---- 6. AI 导入去重（含重复词）----
    const dupJson = JSON.stringify([
      {word: 'smoketest1', phonetic: '/x/', meaning: '测试1', pos: 'n.', theme: '测试主题'},
      {word: 'smoketest1', phonetic: '/x/', meaning: '测试1重复', pos: 'n.', theme: '测试主题'},
      {word: 'smoketest2', phonetic: '/y/', meaning: '测试2', pos: 'n.', theme: '测试主题'}
    ]);
    D.getElementById('gen-result').value = dupJson;
    ev('parseGenerated()');
    await wait(900);
    ok('重复词已去重（应为 2 个新词）', ev('appState.generatedWords.length') === 2, ev('appState.generatedWords.length'));
    await ev('importGenerated()');
    await wait(900);
    const total2 = await ev("getAll('words').then(w => w.length)");
    ok('导入后词库 +2（整批成功）', total2 === 599, total2);

    // ---- 7. 再来一轮（加练）----
    ev('appState.dailyGoal = 3');
    // 把今日计数填到目标值
    await ev(`(async () => {
      let r = await get('daily', getTodayStr());
      if (!r) r = {date: getTodayStr(), total: 3, completed: 0, knownCount: 0, knownIds: [], unknownIds: []};
      r.completed = 3; r.knownCount = 3;
      await put('daily', r);
    })()`);
    ev('startStudy()');
    await wait(500);
    ok('目标完成后普通开始被拦下', D.getElementById('modal').classList.contains('show'), D.getElementById('modal-title').textContent);
    ev('closeModal()');
    ev('startStudy(true)');
    await wait(600);
    const qLen3 = ev('appState.todayQueue.length');
    ok('「再来一轮」真的能开新一轮', qLen3 === 3, '队列=' + qLen3);

    // ---- 8. 键盘快捷键 ----
    const before = ev('appState.currentIndex');
    D.dispatchEvent(new W.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true}));
    await wait(900);
    ok('→ 键 = 认识（指针前进）', ev('appState.currentIndex') === before + 1, before + ' -> ' + ev('appState.currentIndex'));
    const before2 = ev('appState.currentIndex');
    D.dispatchEvent(new W.KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true}));
    await wait(900);
    ok('← 键 = 不认识（指针前进）', ev('appState.currentIndex') === before2 + 1, before2 + ' -> ' + ev('appState.currentIndex'));

    // ---- 9. 本地音频确实加载成功 ----
    ev("speak('apple')"); ev("speak('water')");
    await wait(2500);
    const cached = ev('Object.keys(audioCache).length');
    const disabled = ev('audioDisabled');
    ok('本地 mp3 加载成功并缓存', cached > 0, '缓存 ' + cached + ' 个');
    ok('音频失败计数未触发降级', disabled === false, 'audioDisabled=' + disabled);
    ok('音频地址为本地相对路径', ev('AUDIO_BASE') === 'audio/', ev('AUDIO_BASE'));

    // ---- 10. 无未捕获错误 ----
    ok('无未捕获的 JS 错误', errs.length === 0, errs.join(' ;; ') || '无');
  } catch (e) {
    log('FAIL | 测试脚本异常 | ' + (e && e.message ? e.message : e));
  }
  log('=== DONE ===');
  report();
}
</script>
</body>
</html>
