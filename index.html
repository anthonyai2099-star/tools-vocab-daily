<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Vocab Daily</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiVm9jYWIgRGFpbHkiLCJzaG9ydF9uYW1lIjoiVm9jYWIiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiI2ZmZiIsInRoZW1lX2NvbG9yIjoiIzI1NjNlYiJ9">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

/* Nav */
#nav{height:56px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:relative;z-index:100}
#nav h1{font-size:18px;font-weight:600}
#nav .nav-btn{background:none;border:none;color:#fff;font-size:22px;padding:8px;cursor:pointer}

/* Pages */
#main{flex:1;overflow-y:auto;position:relative}
.page{padding:16px;display:none}
.page.active{display:block}

/* Home */
.home-header{text-align:center;padding:32px 0}
.home-header .big-num{font-size:72px;font-weight:700;color:#2563eb;line-height:1}
.home-header .big-label{font-size:16px;color:#666;margin-top:8px}
.home-progress{width:100%;height:12px;background:#e5e7eb;border-radius:6px;margin:24px 0;overflow:hidden}
.home-progress .bar{height:100%;background:#2563eb;border-radius:6px;transition:width .3s}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;margin:8px 0;text-align:center}
.btn-primary{background:#2563eb;color:#fff}
.btn-secondary{background:#e5e7eb;color:#333}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.theme-tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.theme-tag{padding:6px 14px;border-radius:20px;font-size:13px;background:#e5e7eb;color:#555;border:none;cursor:pointer}
.theme-tag.active{background:#2563eb;color:#fff}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat-card{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-card .num{font-size:28px;font-weight:700;color:#2563eb}
.stat-card .label{font-size:13px;color:#666;margin-top:4px}

/* Study */
#study-area{position:relative;height:calc(100% - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.card-wrap{position:relative;width:100%;max-width:400px;height:420px;margin:0 auto}
.word-card{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:32px 24px;transition:transform .2s,opacity .2s;touch-action:none}
.word-card .word{font-size:36px;font-weight:700;color:#1f2937;text-align:center;margin-top:40px}
.word-card .phonetic{font-size:18px;color:#6b7280;text-align:center;margin-top:8px;font-family:"Lucida Sans Unicode",Arial,sans-serif}
.word-card .meaning{font-size:20px;color:#374151;text-align:center;margin-top:32px;line-height:1.6}
.word-card .theme-label{position:absolute;top:16px;right:16px;font-size:12px;color:#9ca3af;background:#f3f4f6;padding:4px 10px;border-radius:10px}
.speak-btn{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;border:none;background:#eff6ff;color:#2563eb;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.study-controls{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#fff;border-top:1px solid #e5e7eb;display:flex;gap:12px;z-index:50}
.study-controls .btn{margin:0;flex:1}
.study-info{position:fixed;top:56px;left:0;right:0;background:#fef3c7;padding:8px 16px;font-size:13px;color:#92400e;display:flex;justify-content:space-between;align-items:center;z-index:40}
.study-info .undo-link{color:#2563eb;text-decoration:underline;cursor:pointer}
#today-known-list{position:fixed;top:90px;left:16px;right:16px;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-height:300px;overflow-y:auto;padding:12px;z-index:45;display:none}
#today-known-list.show{display:block}
.known-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #f3f4f6}
.known-item button{background:none;border:none;color:#dc2626;font-size:13px;cursor:pointer}

/* Swipe hint */
.swipe-hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:13px;color:#9ca3af}

/* Done */
.done-icon{text-align:center;font-size:64px;margin:24px 0}
.done-title{text-align:center;font-size:24px;font-weight:700}
.done-summary{text-align:center;color:#666;margin:16px 0;line-height:1.8}

/* Vocab */
.vocab-search{width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-bottom:16px}
.vocab-list{background:#fff;border-radius:12px;overflow:hidden}
.vocab-item{padding:14px 16px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center}
.vocab-item .w{font-weight:600;color:#1f2937}
.vocab-item .p{color:#6b7280;font-size:13px;margin-left:8px}
.vocab-item .m{color:#374151;font-size:14px;margin-left:auto;margin-right:8px}
.vocab-item .t{font-size:11px;color:#9ca3af;background:#f3f4f6;padding:2px 8px;border-radius:8px}

/* Generate */
.generate-box{background:#fff;border-radius:12px;padding:20px;margin:16px 0}
.generate-box textarea{width:100%;min-height:120px;border:1px solid #d1d5db;border-radius:8px;padding:12px;font-size:14px;resize:vertical;font-family:inherit}
.generate-box .hint{font-size:13px;color:#666;margin-top:8px}

/* Settings */
.setting-row{background:#fff;border-radius:12px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.setting-row .label{font-weight:500}
.setting-row .value{color:#666;font-size:14px}
input[type="number"]{width:80px;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;text-align:center}
input[type="file"]{display:none}

/* Modal */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toggle{position:relative;display:inline-block;width:48px;height:28px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:14px;transition:.3s}
.toggle-slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked + .toggle-slider{background:#2563eb}
.toggle input:checked + .toggle-slider:before{transform:translateX(20px)}

/* Empty state */
.empty{text-align:center;padding:48px 16px;color:#9ca3af}
.empty .icon{font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <button class="nav-btn" id="menu-btn" onclick="toggleMenu()">&#9776;</button>
    <h1>Vocab Daily</h1>
    <button class="nav-btn" id="back-btn" onclick="showPage('home')" style="display:none">&#10005;</button>
  </nav>

  <main id="main">
    <!-- HOME -->
    <section id="page-home" class="page active">
      <div class="home-header">
        <div class="big-num" id="home-remain">0</div>
        <div class="big-label">今日剩余 / <span id="home-total">500</span></div>
      </div>
      <div class="home-progress"><div class="bar" id="home-bar" style="width:0%"></div></div>
      <button class="btn btn-primary" id="btn-start" onclick="startStudy()">开始学习</button>
      <button class="btn btn-secondary" onclick="showPage('vocab')">查看词库</button>
      <button class="btn btn-secondary" onclick="showPage('generate')">主题生成</button>
      <button class="btn btn-secondary" onclick="showPage('settings')">设置</button>

      <div class="stats-grid">
        <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">总词量</div></div>
        <div class="stat-card"><div class="num" id="stat-known">0</div><div class="label">已掌握</div></div>
        <div class="stat-card"><div class="num" id="stat-unknown">0</div><div class="label">待学习</div></div>
        <div class="stat-card"><div class="num" id="stat-days">1</div><div class="label">学习天数</div></div>
      </div>

      <div style="margin-top:16px">
        <div style="font-size:14px;color:#666;margin-bottom:8px">主题筛选（关闭的主题不会出现在学习中）</div>
        <div class="theme-tags" id="theme-tags"></div>
      </div>
    </section>

    <!-- STUDY -->
    <section id="page-study" class="page">
      <div class="study-info">
        <span>今日进度: <b id="study-progress">0/500</b></span>
        <span>已认识: <b id="study-known">0</b> <span class="undo-link" onclick="toggleKnownList()">查看/撤销</span></span>
      </div>
      <div id="today-known-list"></div>
      <div id="study-area">
        <div class="card-wrap" id="card-wrap"></div>
        <div class="swipe-hint">右滑 = 认识 &nbsp;|&nbsp; 左滑 = 不认识</div>
      </div>
      <div class="study-controls">
        <button class="btn btn-secondary" onclick="handleUnknown()">不认识 / 下一个</button>
        <button class="btn btn-success" onclick="handleKnown()">认识</button>
      </div>
    </section>

    <!-- DONE -->
    <section id="page-done" class="page">
      <div class="done-icon">&#127942;</div>
      <div class="done-title">今日完成!</div>
      <div class="done-summary" id="done-summary"></div>
      <button class="btn btn-primary" onclick="showPage('home')">返回首页</button>
      <button class="btn btn-secondary" onclick="startStudy()">再来一轮</button>
    </section>

    <!-- VOCAB -->
    <section id="page-vocab" class="page">
      <input type="text" class="vocab-search" id="vocab-search" placeholder="搜索单词..." oninput="renderVocab()">
      <div class="vocab-list" id="vocab-list"></div>
    </section>

    <!-- GENERATE -->
    <section id="page-generate" class="page">
      <div class="generate-box">
        <div style="font-weight:600;margin-bottom:12px">第一步：输入主题</div>
        <input type="text" id="gen-theme" placeholder="例如：军事无人机、航空发动机、商务谈判..." style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px">
        <button class="btn btn-primary" style="margin-top:12px" onclick="generatePrompt()">生成提示词</button>
      </div>
      <div class="generate-box" id="gen-prompt-box" style="display:none">
        <div style="font-weight:600;margin-bottom:12px">第二步：复制提示词到任意AI工具</div>
        <textarea id="gen-prompt" readonly></textarea>
        <button class="btn btn-secondary" style="margin-top:8px" onclick="copyPrompt()">复制提示词</button>
      </div>
      <div class="generate-box" id="gen-result-box" style="display:none">
        <div style="font-weight:600;margin-bottom:12px">第三步：粘贴AI返回的结果</div>
        <textarea id="gen-result" placeholder='粘贴AI返回的JSON，格式：[{"word":"apple","phonetic":"/ˈæp.l/","meaning":"苹果","theme":"水果"}]'></textarea>
        <button class="btn btn-primary" style="margin-top:8px" onclick="parseGenerated()">解析并预览</button>
      </div>
      <div class="generate-box" id="gen-preview-box" style="display:none">
        <div style="font-weight:600;margin-bottom:12px">预览新单词（<span id="gen-count">0</span>个）</div>
        <div class="vocab-list" id="gen-preview-list" style="max-height:300px;overflow-y:auto"></div>
        <button class="btn btn-success" style="margin-top:12px" onclick="importGenerated()">确认导入</button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="page-settings" class="page">
      <div class="setting-row">
        <div>
          <div class="label">每日目标</div>
          <div class="value">每天学习的单词数量</div>
        </div>
        <input type="number" id="setting-daily" value="500" min="10" max="1000" step="10" onchange="saveSettings()">
      </div>
      <div class="setting-row">
        <div>
          <div class="label">自动发音</div>
          <div class="value">新卡片出现时自动朗读</div>
        </div>
        <label class="toggle"><input type="checkbox" id="setting-autospeak" checked onchange="saveSettings()"><span class="toggle-slider"></span></label>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">导出备份</div>
          <div class="value">下载所有词库和学习进度</div>
        </div>
        <button class="btn btn-secondary" style="width:auto;padding:10px 20px;font-size:14px" onclick="exportData()">导出</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">导入备份</div>
          <div class="value">从文件恢复数据</div>
        </div>
        <button class="btn btn-secondary" style="width:auto;padding:10px 20px;font-size:14px" onclick="document.getElementById('import-file').click()">导入</button>
        <input type="file" id="import-file" accept=".json" onchange="importData(this)">
      </div>
      <div class="setting-row">
        <div>
          <div class="label">重置进度</div>
          <div class="value">清除所有学习记录（保留词库）</div>
        </div>
        <button class="btn btn-danger" style="width:auto;padding:10px 20px;font-size:14px" onclick="resetProgress()">重置</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">清空词库</div>
          <div class="value">删除所有单词（不可逆）</div>
        </div>
        <button class="btn btn-danger" style="width:auto;padding:10px 20px;font-size:14px" onclick="clearAll()">清空</button>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">提示</div>
    <div id="modal-body"></div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="closeModal()">确定</button>
  </div>
</div>

<div class="toast" id="toast"></div>

// ==================== IndexedDB ====================
const DB_NAME = 'VocabDailyDB';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('words')) {
        const w = db.createObjectStore('words', {keyPath: 'id'});
        w.createIndex('theme', 'theme', {unique: false});
        w.createIndex('word', 'word', {unique: true});
      }
      if (!db.objectStoreNames.contains('progress')) {
        const p = db.createObjectStore('progress', {keyPath: 'wordId'});
        p.createIndex('status', 'status', {unique: false});
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', {keyPath: 'key'});
      }
      if (!db.objectStoreNames.contains('daily')) {
        db.createObjectStore('daily', {keyPath: 'date'});
      }
    };
  });
}

async function withStore(storeName, mode = 'readonly') {
  const db = await openDB();
  return db.transaction(storeName, mode).objectStore(storeName);
}

async function getAll(storeName) {
  const store = await withStore(storeName);
  return new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function put(storeName, data) {
  const store = await withStore(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.put(data);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function get(storeName, key) {
  const store = await withStore(storeName);
  return new Promise((resolve, reject) => {
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function remove(storeName, key) {
  const store = await withStore(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function clearStore(storeName) {
  const store = await withStore(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ==================== 工具函数 ====================
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function showModal(title, body) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('menu-btn').style.display = name === 'home' ? 'inline-block' : 'none';
  document.getElementById('back-btn').style.display = name === 'home' ? 'none' : 'inline-block';
  if (name === 'home') renderHome();
  if (name === 'vocab') renderVocab();
}

function speak(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.8;
  window.speechSynthesis.speak(u);
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ==================== 初始化 ====================
async function init() {
  appState.db = await openDB();

  // 导入/合并内置词库（新增词 + 补全已有词字段）
  const existing = await getAll('words');
  const existingMap = new Map(existing.map(w => [w.word.toLowerCase(), w]));
  const newWords = [];
  const updatedWords = [];

  for (const w of UNIQUE_VOCAB) {
    const old = existingMap.get(w.word.toLowerCase());
    if (!old) {
      newWords.push(w);
    } else if (!old.pos && w.pos) {
      // 已有但缺少 pos 等字段，补全（保留原 id，不丢进度）
      updatedWords.push({...old, pos: w.pos});
    }
  }

  if (newWords.length > 0 || updatedWords.length > 0) {
    const tx = appState.db.transaction('words', 'readwrite');
    const store = tx.objectStore('words');
    for (const w of newWords) store.put(w);
    for (const w of updatedWords) store.put(w);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
    if (existing.length > 0) {
      let msg = '';
      if (newWords.length > 0) msg += `新增 ${newWords.length} 个`;
      if (updatedWords.length > 0) msg += (msg ? ' · ' : '') + `更新 ${updatedWords.length} 个`;
      showToast(`词库已更新：${msg}`);
    }
  }

  // 加载设置
  const goalSetting = await get('settings', 'dailyGoal');
  if (goalSetting) {
    appState.dailyGoal = goalSetting.value;
    document.getElementById('setting-daily').value = appState.dailyGoal;
  }

  const themeSetting = await get('settings', 'activeThemes');
  if (themeSetting) appState.activeThemes = themeSetting.value;

  const autoSpeakSetting = await get('settings', 'autoSpeak');
  if (autoSpeakSetting !== undefined) {
    document.getElementById('setting-autospeak').checked = autoSpeakSetting.value;
  }

  renderHome();
}

// ==================== 首页 ====================
async function renderHome() {
  const words = await getAll('words');
  const progress = await getAll('progress');

  // 提取所有主题
  const themes = [...new Set(words.map(w => w.theme))].sort();
  appState.allThemes = themes;
  if (appState.activeThemes.length === 0) appState.activeThemes = [...themes];

  // 统计
  const knownIds = new Set(progress.filter(p => p.status === 'known').map(p => p.wordId));
  const unknownCount = words.filter(w => !knownIds.has(w.id) && appState.activeThemes.includes(w.theme)).length;
  const knownCount = words.filter(w => knownIds.has(w.id)).length;
  const totalCount = words.length;

  document.getElementById('stat-total').textContent = totalCount;
  document.getElementById('stat-known').textContent = knownCount;
  document.getElementById('stat-unknown').textContent = unknownCount;

  // 今日进度
  const todayStr = getTodayStr();
  const todayRec = await get('daily', todayStr);
  const todayDone = todayRec ? todayRec.completed : 0;
  const todayKnown = todayRec ? todayRec.knownCount : 0;
  const remain = Math.max(0, appState.dailyGoal - todayDone);

  document.getElementById('home-remain').textContent = remain;
  document.getElementById('home-total').textContent = appState.dailyGoal;
  document.getElementById('home-bar').style.width = Math.min(100, (todayDone / appState.dailyGoal) * 100) + '%';

  // 主题标签
  const tagContainer = document.getElementById('theme-tags');
  tagContainer.innerHTML = themes.map(t => {
    const active = appState.activeThemes.includes(t);
    return `<button class="theme-tag ${active?'active':''}" onclick="toggleTheme('${t}')">${t}</button>`;
  }).join('');

  // 学习天数（有记录的不同日期数）
  const allDaily = await getAll('daily');
  document.getElementById('stat-days').textContent = allDaily.length || 1;
}

async function toggleTheme(theme) {
  if (appState.activeThemes.includes(theme)) {
    if (appState.activeThemes.length <= 1) {
      showToast('至少保留一个主题');
      return;
    }
    appState.activeThemes = appState.activeThemes.filter(t => t !== theme);
  } else {
    appState.activeThemes.push(theme);
  }
  await put('settings', {key:'activeThemes', value:appState.activeThemes});
  renderHome();
}

// ==================== 组卷与学习 ====================
async function startStudy() {
  const todayStr = getTodayStr();
  const words = await getAll('words');
  const progress = await getAll('progress');

  // 构建状态映射
  const progMap = new Map(progress.map(p => [p.wordId, p]));
  const knownIds = new Set(progress.filter(p => p.status === 'known').map(p => p.wordId));

  // 筛选可用单词（未认识且在激活主题中）
  let available = words.filter(w => !knownIds.has(w.id) && appState.activeThemes.includes(w.theme));

  if (available.length === 0) {
    showModal('提示', '当前主题下所有单词都已掌握！可以去「主题生成」添加新词库。');
    return;
  }

  // 检查今天是否已有记录
  let todayRec = await get('daily', todayStr);
  if (!todayRec) {
    todayRec = {date: todayStr, total: appState.dailyGoal, completed: 0, knownCount: 0, knownIds: [], unknownIds: []};
  }

  // 排除今天已经学过的词（无论认识/不认识，今天不再出现）
  const todayLearnedIds = new Set([
    ...(todayRec.knownIds || []),
    ...(todayRec.unknownIds || [])
  ]);
  available = available.filter(w => !todayLearnedIds.has(w.id));

  if (available.length === 0) {
    if (todayRec.completed > 0) {
      showModal('提示', '今天该学的单词都已经学过了！明天会安排复习。');
    } else {
      showModal('提示', '当前主题下所有单词都已掌握！可以去「主题生成」添加新词库。');
    }
    return;
  }

  // 组卷：优先 yesterday unknown，然后随机新词
  const yesterdayStr = getYesterdayStr();
  const yesterdayRec = await get('daily', yesterdayStr);
  const yesterdayUnknown = new Set();
  if (yesterdayRec && yesterdayRec.unknownIds) {
    yesterdayRec.unknownIds.forEach(id => yesterdayUnknown.add(id));
  }

  // 按优先级排序
  available.sort((a, b) => {
    const aUnknown = yesterdayUnknown.has(a.id) ? 1 : 0;
    const bUnknown = yesterdayUnknown.has(b.id) ? 1 : 0;
    if (aUnknown !== bUnknown) return bUnknown - aUnknown;
    const aReview = progMap.get(a.id)?.reviewCount || 0;
    const bReview = progMap.get(b.id)?.reviewCount || 0;
    return bReview - aReview;
  });

  // 取今天需要学习的数量（不超过剩余可用词）
  const need = Math.min(appState.dailyGoal - todayRec.completed, available.length);

  if (need <= 0) {
    showModal('提示', '今日目标已完成！可以再来一轮或明天继续。');
    return;
  }

  appState.todayQueue = available.slice(0, need);
  appState.currentIndex = 0;
  appState.todayKnown = [];

  showPage('study');
  renderCard();
  updateStudyInfo();
  if (document.getElementById('setting-autospeak').checked) speak(appState.todayQueue[0].word);
}

function getYesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function updateStudyInfo() {
  const todayStr = getTodayStr();
  get('daily', todayStr).then(rec => {
    const completed = rec ? rec.completed : 0;
    const known = rec ? rec.knownCount : 0;
    document.getElementById('study-progress').textContent = completed + '/' + appState.dailyGoal;
    document.getElementById('study-known').textContent = known;
  });
}

function renderCard() {
  const wrap = document.getElementById('card-wrap');
  if (appState.currentIndex >= appState.todayQueue.length) {
    showDonePage();
    return;
  }

  const word = appState.todayQueue[appState.currentIndex];
  wrap.innerHTML = `
    <div class="word-card" id="active-card">
      <button class="speak-btn" onclick="speak('${word.word}')">&#128266;</button>
      <span class="theme-label">${word.theme}</span>
      <div class="word">${word.word}</div>
      <div class="phonetic">${word.phonetic} <span style="color:#9ca3af;font-size:16px;margin-left:8px">${word.pos || ''}</span></div>
      <div class="meaning">${word.meaning}</div>
    </div>
  `;

  // 绑定滑动
  bindSwipe(document.getElementById('active-card'));
}

function bindSwipe(card) {
  let startX = 0, startY = 0, dx = 0, dy = 0;
  card.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive:true});
  card.addEventListener('touchmove', e => {
    dx = e.touches[0].clientX - startX;
    dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) {
      card.style.transform = `translateX(${dx}px) rotate(${dx*0.05}deg)`;
    }
  }, {passive:true});
  card.addEventListener('touchend', () => {
    if (dx > 80) {
      handleKnown();
    } else if (dx < -80) {
      handleUnknown();
    } else {
      card.style.transform = '';
    }
    dx = 0;
  });
}

async function handleKnown() {
  const word = appState.todayQueue[appState.currentIndex];
  if (!word) return;

  // 更新进度
  await put('progress', {
    wordId: word.id,
    status: 'known',
    lastReviewed: new Date().toISOString(),
    reviewCount: 0
  });

  // 记录今日
  const todayStr = getTodayStr();
  let rec = await get('daily', todayStr);
  if (!rec) rec = {date: todayStr, total: appState.dailyGoal, completed: 0, knownCount: 0, knownIds: [], unknownIds: []};
  rec.completed++;
  rec.knownCount++;
  rec.knownIds = rec.knownIds || [];
  rec.knownIds.push(word.id);
  await put('daily', rec);

  // 加入今日可撤销列表
  appState.todayKnown.push(word);

  appState.currentIndex++;
  if (document.getElementById('setting-autospeak').checked) {
    const next = appState.todayQueue[appState.currentIndex];
    if (next) speak(next.word);
  }
  animateCard('right');
}

async function handleUnknown() {
  const word = appState.todayQueue[appState.currentIndex];
  if (!word) return;

  const prog = await get('progress', word.id);
  const reviewCount = prog ? (prog.reviewCount || 0) + 1 : 1;

  await put('progress', {
    wordId: word.id,
    status: 'unknown',
    lastReviewed: new Date().toISOString(),
    reviewCount: reviewCount
  });

  const todayStr = getTodayStr();
  let rec = await get('daily', todayStr);
  if (!rec) rec = {date: todayStr, total: appState.dailyGoal, completed: 0, knownCount: 0, knownIds: [], unknownIds: []};
  rec.completed++;
  rec.unknownIds = rec.unknownIds || [];
  rec.unknownIds.push(word.id);
  await put('daily', rec);

  appState.currentIndex++;
  if (document.getElementById('setting-autospeak').checked) {
    const next = appState.todayQueue[appState.currentIndex];
    if (next) speak(next.word);
  }
  animateCard('left');
}

function animateCard(direction) {
  const card = document.getElementById('active-card');
  if (!card) { renderCard(); return; }
  card.style.transition = 'transform 0.3s, opacity 0.3s';
  card.style.transform = direction === 'right' ? 'translateX(120%) rotate(15deg)' : 'translateX(-120%) rotate(-15deg)';
  card.style.opacity = '0';
  setTimeout(() => {
    renderCard();
    updateStudyInfo();
  }, 300);
}

function toggleKnownList() {
  const list = document.getElementById('today-known-list');
  if (list.classList.contains('show')) {
    list.classList.remove('show');
    return;
  }
  list.innerHTML = appState.todayKnown.length === 0
    ? '<div style="padding:12px;color:#666;text-align:center">今天还没有标记认识的单词</div>'
    : appState.todayKnown.map((w,i) => `
      <div class="known-item">
        <span><b>${w.word}</b> ${w.meaning}</span>
        <button onclick="undoKnown(${i})">撤销</button>
      </div>
    `).join('');
  list.classList.add('show');
}

async function undoKnown(index) {
  const word = appState.todayKnown[index];
  if (!word) return;

  // 删除进度记录中的known状态
  await remove('progress', word.id);

  // 修正今日记录
  const todayStr = getTodayStr();
  let rec = await get('daily', todayStr);
  if (rec) {
    rec.knownCount = Math.max(0, rec.knownCount - 1);
    rec.completed = Math.max(0, rec.completed - 1);
    rec.knownIds = (rec.knownIds || []).filter(id => id !== word.id);
    // 把这个词重新加回今日队列
    appState.todayQueue.splice(appState.currentIndex, 0, word);
    await put('daily', rec);
  }

  appState.todayKnown.splice(index, 1);
  toggleKnownList();
  toggleKnownList(); // refresh
  updateStudyInfo();
  renderCard();
  showToast('已撤销');
}

// ==================== 完成页 ====================
async function showDonePage() {
  const todayStr = getTodayStr();
  const rec = await get('daily', todayStr);
  const known = rec ? rec.knownCount : 0;
  const words = await getAll('words');
  const progress = await getAll('progress');
  const knownIds = new Set(progress.filter(p => p.status === 'known').map(p => p.wordId));
  const remain = words.filter(w => !knownIds.has(w.id) && appState.activeThemes.includes(w.theme)).length;

  document.getElementById('done-summary').innerHTML = `
    今日标记认识 <b>${known}</b> 个单词<br>
    当前主题下还有 <b>${remain}</b> 个单词待掌握<br>
    继续加油！
  `;
  showPage('done');
}

// ==================== 词库页 ====================
async function renderVocab() {
  const search = document.getElementById('vocab-search').value.toLowerCase();
  const words = await getAll('words');
  const filtered = words.filter(w =>
    w.word.toLowerCase().includes(search) ||
    w.meaning.includes(search) ||
    w.theme.includes(search)
  );

  const list = document.getElementById('vocab-list');
  const totalInfo = `<div style="font-size:14px;color:#666;margin-bottom:12px">词库共 ${words.length} 个单词 · 当前显示 ${filtered.length} 个</div>`;
  if (filtered.length === 0) {
    list.innerHTML = totalInfo + '<div class="empty"><div class="icon">&#128218;</div>没有找到单词</div>';
    return;
  }
  list.innerHTML = totalInfo + filtered.map(w => `
    <div class="vocab-item">
      <div>
        <span class="w">${w.word}</span>
        <span class="p">${w.phonetic}</span>
        <span class="p">${w.pos || ''}</span>
      </div>
      <span class="m">${w.meaning}</span>
      <span class="t">${w.theme}</span>
    </div>
  `).join('');
}

// ==================== 生成向导 ====================
function generatePrompt() {
  const theme = document.getElementById('gen-theme').value.trim();
  if (!theme) { showToast('请输入主题'); return; }

  const prompt = `Please generate a vocabulary list for the theme "${theme}".
The list should contain common English words that a learner would encounter in this context.
For each word, provide:
- word: the English word
- phonetic: IPA phonetic transcription (American pronunciation)
- meaning: Chinese translation
- pos: part of speech abbreviation (n./v./adj./adv./prep./conj./pron./etc.)
- theme: "${theme}"

Return ONLY a valid JSON array in this exact format, no markdown, no explanation:
[
  {"word":"example","phonetic":"/ɪɡˈzæm.pəl/","meaning":"例子","pos":"n.","theme":"${theme}"},
  ...
]

Generate as many common vocabulary words as appropriate for this theme.`;

  document.getElementById('gen-prompt').value = prompt;
  document.getElementById('gen-prompt-box').style.display = 'block';
  document.getElementById('gen-result-box').style.display = 'block';
  document.getElementById('gen-preview-box').style.display = 'none';
}

function copyPrompt() {
  const el = document.getElementById('gen-prompt');
  el.select();
  document.execCommand('copy');
  showToast('提示词已复制');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function parseGenerated() {
  const text = document.getElementById('gen-result').value.trim();
  if (!text) { showToast('请先粘贴AI返回的结果'); return; }

  let data = null;

  // 尝试1：直接解析整个文本
  try { data = JSON.parse(text); } catch(e) {}

  // 尝试2：去掉markdown代码块后解析
  if (!data) {
    try {
      const clean = text.replace(/```(?:json)?\s*([\s\S]*?)\s*```/g, '$1').trim();
      if (clean !== text) data = JSON.parse(clean);
    } catch(e) {}
  }

  // 尝试3：提取方括号内容
  if (!data) {
    try {
      const match = text.match(/\[[\s\S]*\]/);
      if (match) data = JSON.parse(match[0]);
    } catch(e) {}
  }

  // 尝试4：去掉markdown后提取方括号
  if (!data) {
    try {
      const clean = text.replace(/```(?:json)?\s*([\s\S]*?)\s*```/g, '$1').trim();
      const match = clean.match(/\[[\s\S]*\]/);
      if (match) data = JSON.parse(match[0]);
    } catch(e) {}
  }

  // 尝试5：找花括号对象，提取里面的第一个数组字段
  if (!data) {
    try {
      const match = text.match(/\{[\s\S]*\}/);
      if (match) {
        const obj = JSON.parse(match[0]);
        for (const key in obj) {
          if (Array.isArray(obj[key]) && obj[key].length > 0) {
            data = obj[key];
            break;
          }
        }
      }
    } catch(e) {}
  }

  if (!data) {
    showModal('解析失败',
      '无法从AI返回的内容中解析出JSON。<br><br>' +
      '常见原因：<br>' +
      '1. AI返回的不是标准JSON格式<br>' +
      '2. 使用了中文引号 "" 而不是英文引号 ""<br>' +
      '3. JSON末尾有多余逗号<br><br>' +
      '原始内容片段：<br>' +
      '<pre style="background:#f3f4f6;padding:8px;border-radius:6px;overflow-x:auto;font-size:12px">' +
      escapeHtml(text.slice(0, 800)) +
      '</pre><br>请检查后重新粘贴。'
    );
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    showModal('解析失败', '解析成功但未找到单词数组。AI可能返回了对象而非数组，或者数组为空。');
    return;
  }

  // 字段映射：支持中英文字段名
  function mapFields(item) {
    if (!item || typeof item !== 'object') return null;
    const keys = Object.keys(item);
    const findKey = (candidates) => {
      for (const c of candidates) {
        const lk = c.toLowerCase();
        const found = keys.find(k => k.toLowerCase() === lk);
        if (found) return item[found];
      }
      return undefined;
    };
    const word = findKey(['word','单词','词汇','Word','WORD']);
    if (!word || typeof word !== 'string') return null;
    return {
      word: word.trim(),
      phonetic: String(findKey(['phonetic','音标','发音','phonetics','ipa','Phonetic']) || ''),
      meaning: String(findKey(['meaning','释义','翻译','中文','意思','definition','translation','Meaning']) || ''),
      pos: String(findKey(['pos','词性','partOfSpeech','part','POS']) || ''),
      theme: String(findKey(['theme','主题','分类','topic','Theme']) || document.getElementById('gen-theme').value.trim())
    };
  }

  const mapped = data.map(mapFields).filter(Boolean);

  if (mapped.length === 0) {
    showModal('解析失败',
      '找到了JSON数组，但无法识别字段名。AI可能使用了不常见的字段名。<br><br>' +
      '支持的字段名：<br>' +
      '单词：word / 单词 / 词汇<br>' +
      '释义：meaning / 释义 / 翻译 / 中文 / 意思<br>' +
      '音标：phonetic / 音标 / 发音<br>' +
      '主题：theme / 主题 / 分类<br><br>' +
      '原始内容片段：<br>' +
      '<pre style="background:#f3f4f6;padding:8px;border-radius:6px;overflow-x:auto;font-size:12px">' +
      escapeHtml(text.slice(0, 800)) +
      '</pre>'
    );
    return;
  }

  // 去重 + 分类
  Promise.all([getAll('words'), getAll('progress')]).then(([words, progress]) => {
    const existingMap = new Map(words.map(w => [w.word.toLowerCase(), w]));
    const knownIds = new Set(progress.filter(p => p.status === 'known').map(p => p.wordId));

    const result = { newWords: [], existingWords: [], knownWords: [] };

    for (const w of mapped) {
      const lower = w.word.toLowerCase();
      const existing = existingMap.get(lower);
      if (!existing) {
        result.newWords.push(w);
      } else if (knownIds.has(existing.id)) {
        result.knownWords.push(w);
      } else {
        result.existingWords.push(w);
      }
    }

    appState.generatedWords = result.newWords.map((w, i) => ({
      id: 'gen_' + Date.now() + '_' + i,
      word: w.word,
      phonetic: w.phonetic,
      meaning: w.meaning,
      pos: w.pos || '',
      theme: w.theme
    }));
    appState.generatedExisting = result.existingWords;
    appState.generatedKnown = result.knownWords;

    const total = mapped.length;
    const stats = `<div style="font-size:14px;color:#666;margin-bottom:12px">
      共解析 ${total} 个 · 新词 <b>${result.newWords.length}</b> 个
      ${result.existingWords.length > 0 ? '· 已存在 ' + result.existingWords.length + ' 个' : ''}
      ${result.knownWords.length > 0 ? '· 你已认识 ' + result.knownWords.length + ' 个' : ''}
    </div>`;

    if (appState.generatedWords.length === 0) {
      let msg = '所有单词都已存在于词库中。';
      if (result.knownWords.length > 0) {
        msg += `<br><br>其中 ${result.knownWords.length} 个你已认识：<br>` +
          result.knownWords.map(w => `<span style="color:#16a34a">${escapeHtml(w.word)}</span>`).join('、');
      }
      if (result.existingWords.length > 0) {
        msg += `<br><br>${result.existingWords.length} 个已存在但未认识：<br>` +
          result.existingWords.map(w => escapeHtml(w.word)).join('、');
      }
      showModal('导入提示', msg);
      return;
    }

    document.getElementById('gen-count').textContent = appState.generatedWords.length;
    document.getElementById('gen-preview-list').innerHTML = stats + appState.generatedWords.map(w => `
      <div class="vocab-item">
        <div><span class="w">${escapeHtml(w.word)}</span><span class="p">${escapeHtml(w.phonetic)}</span><span class="p">${escapeHtml(w.pos || '')}</span></div>
        <span class="m">${escapeHtml(w.meaning)}</span>
      </div>
    `).join('');
    document.getElementById('gen-preview-box').style.display = 'block';
    showToast(`解析成功，发现 ${appState.generatedWords.length} 个新单词`);
  }).catch(err => {
    showModal('解析出错', '读取现有词库失败：' + err.message);
  });
}

async function importGenerated() {
  if (appState.generatedWords.length === 0) return;
  const count = appState.generatedWords.length;
  const db = await openDB();
  const tx = db.transaction('words', 'readwrite');
  const store = tx.objectStore('words');
  for (const w of appState.generatedWords) store.put(w);
  await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});

  const existingCount = appState.generatedExisting ? appState.generatedExisting.length : 0;
  const knownCount = appState.generatedKnown ? appState.generatedKnown.length : 0;

  appState.generatedWords = [];
  appState.generatedExisting = [];
  appState.generatedKnown = [];
  document.getElementById('gen-theme').value = '';
  document.getElementById('gen-result').value = '';
  document.getElementById('gen-prompt-box').style.display = 'none';
  document.getElementById('gen-result-box').style.display = 'none';
  document.getElementById('gen-preview-box').style.display = 'none';
  let msg = `成功导入 <b>${count}</b> 个新单词！`;
  if (existingCount > 0 || knownCount > 0) {
    msg += `<br><br>跳过 ${existingCount + knownCount} 个：`;
    if (knownCount > 0) msg += `<br>· <span style="color:#16a34a">${knownCount} 个你已认识</span>`;
    if (existingCount > 0) msg += `<br>· ${existingCount} 个已存在于词库`;
  }
  showModal('导入完成', msg);
  renderHome();
}

// ==================== 设置 ====================
async function saveSettings() {
  const val = parseInt(document.getElementById('setting-daily').value);
  appState.dailyGoal = Math.max(10, Math.min(1000, val));
  document.getElementById('setting-daily').value = appState.dailyGoal;
  await put('settings', {key:'dailyGoal', value:appState.dailyGoal});

  const autoSpeak = document.getElementById('setting-autospeak').checked;
  await put('settings', {key:'autoSpeak', value:autoSpeak});

  showToast('设置已保存');
}

async function exportData() {
  const words = await getAll('words');
  const progress = await getAll('progress');
  const settings = await getAll('settings');
  const daily = await getAll('daily');
  const data = {words, progress, settings, daily, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'vocab-backup-' + getTodayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份已下载');
}

async function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const text = await file.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch(e) {
    showToast('文件格式错误');
    return;
  }

  if (!data.words) { showToast('无效的备份文件'); return; }

  const db = await openDB();

  if (data.words) {
    const tx = db.transaction('words', 'readwrite');
    const store = tx.objectStore('words');
    for (const w of data.words) store.put(w);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }
  if (data.progress) {
    const tx = db.transaction('progress', 'readwrite');
    const store = tx.objectStore('progress');
    for (const p of data.progress) store.put(p);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }
  if (data.settings) {
    const tx = db.transaction('settings', 'readwrite');
    const store = tx.objectStore('settings');
    for (const s of data.settings) store.put(s);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }
  if (data.daily) {
    const tx = db.transaction('daily', 'readwrite');
    const store = tx.objectStore('daily');
    for (const d of data.daily) store.put(d);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }

  input.value = '';
  showToast('数据恢复成功');
  renderHome();
}

async function resetProgress() {
  if (!confirm('确定要清除所有学习记录吗？词库会保留。')) return;
  await clearStore('progress');
  await clearStore('daily');
  showToast('学习进度已重置');
  renderHome();
}

async function clearAll() {
  if (!confirm('确定要删除所有数据吗？此操作不可逆！')) return;
  await clearStore('words');
  await clearStore('progress');
  await clearStore('daily');
  await clearStore('settings');
  showToast('所有数据已清除');
  renderHome();
}
